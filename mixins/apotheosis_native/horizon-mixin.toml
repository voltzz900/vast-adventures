[mod]
id = "apotheosis_native"
version = "0.7.0"
priority = 100

# The commit it is built for. Besides the native hook points it hooks the game's own `apply_equipment` and the
# anvil's `native_anvil_update`, so it is pinned to this commit.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# The rolling, as `horizon_world::apotheosis`: the loot hooks live in horizon-world and the game's in
# horizon-client, which depends on it.
[[module]]
id = "runtime"
file = "crates/horizon-world/src/lib.rs"
name = "apotheosis"
source = "runtime.rs"
visibility = "pub"

# Gems and sockets, as `horizon_world::apotheosis_gems`.
[[module]]
id = "gems"
file = "crates/horizon-world/src/lib.rs"
name = "apotheosis_gems"
source = "gems.rs"
visibility = "pub"

# Bosses and elites, as `horizon_world::apotheosis_bosses`.
[[module]]
id = "bosses"
file = "crates/horizon-world/src/lib.rs"
name = "apotheosis_bosses"
source = "bosses.rs"
visibility = "pub"

# What affixes and gems do beyond attributes, as `horizon_world::apotheosis_effects`.
[[module]]
id = "effects"
file = "crates/horizon-world/src/lib.rs"
name = "apotheosis_effects"
source = "effects.rs"
visibility = "pub"

# The game's side: stacks' own modifiers on the player and in tooltips, socketing at the anvil, and spawning
# bosses and elites.
[[module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "apotheosis_client"
source = "client.rs"

# Apotheosis' rarities, attribute affixes, chest loot entries, gems and purities (generated by tools/gen_data.py).
[[module]]
id = "data"
file = "crates/horizon-world/src/lib.rs"
name = "apotheosis_data"
source = "data.rs"
visibility = "pub"

[api]
path = "api"

[[injection]]
id = "loot-table-load"
hook = "loot_table_load"
hook_version = 1
kind = "HEAD"
helper = "loot_table_load.rs"
bindings = [
  { name = "id", ty = "&str", value = "id" },
  { name = "table", ty = "&mut serde_json::Value", value = "&mut *table" },
]

[[injection]]
id = "loot-function"
hook = "loot_function"
hook_version = 1
kind = "HEAD"
helper = "loot_function.rs"
bindings = [
  { name = "kind", ty = "&str", value = "kind" },
  { name = "data", ty = "&serde_json::Value", value = "data" },
  { name = "ctx", ty = "&crate::loot::NativeLootContext<'_>", value = "ctx" },
  { name = "stack", ty = "&mut crate::loot::LootStack", value = "&mut *stack" },
]

[[injection]]
id = "loot-condition"
hook = "loot_condition"
hook_version = 1
kind = "HEAD"
helper = "loot_condition.rs"
bindings = [
  { name = "kind", ty = "&str", value = "kind" },
  { name = "ctx", ty = "&crate::loot::NativeLootContext<'_>", value = "ctx" },
  { name = "holds", ty = "&mut bool", value = "&mut *holds" },
]

# Items' default attribute modifiers and worn slot, for the loot category and to keep a weapon's own damage.
[[injection]]
id = "defaults"
hook = "modify_default_components"
hook_version = 1
kind = "HEAD"
helper = "defaults.rs"
bindings = [
  { name = "item", ty = "&str", value = "item" },
  { name = "components", ty = "&serde_json::Map<String, serde_json::Value>", value = "&*components" },
]

# The world tier: read when a world opens, set with /apotheosis tier.
[[injection]]
id = "world-open"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "world_open.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "horizon_client::mod_api::WorldPhase", value = "phase" },
]

[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# Horizon applies only an item kind's modifiers: after it does, the stacks' own (at the head of
# `apply_enchantment_attributes`, which `apply_equipment` calls last).
[[injection]]
id = "equipment"
kind = "HEAD"
target = "horizon_client::game::enchant_effects::Game<'_>::apply_enchantment_attributes"
helper = "equipment.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "tooltip.rs"
bindings = [
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::text::Text, u32)>", value = "&mut *lines" },
]

# Socketing: the anvil's result for an item and a gem.
[[injection]]
id = "anvil"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_anvil_update"
helper = "anvil.rs"
bindings = [
  { name = "left", ty = "&horizon_client::items::ItemStack", value = "left" },
  { name = "right", ty = "Option<&horizon_client::items::ItemStack>", value = "right" },
  { name = "output", ty = "&mut Option<horizon_client::items::ItemStack>", value = "&mut *output" },
  { name = "xp_cost", ty = "&mut i32", value = "&mut *xp_cost" },
  { name = "material_cost", ty = "&mut i32", value = "&mut *material_cost" },
]

# Bosses and elites among the monsters the world spawns.
[[injection]]
id = "mobs-joined"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mobs_joined"
helper = "mobs_joined.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "from", ty = "usize", value = "from" },
  { name = "natural", ty = "bool", value = "natural" },
]

# Salvaging at the grindstone.
[[injection]]
id = "grindstone"
kind = "HEAD"
cancellable = true
target = "horizon_client::stations::grindstone_result"
helper = "grindstone.rs"
bindings = [
  { name = "input", ty = "Option<&ItemStack>", value = "input" },
  { name = "additional", ty = "Option<&ItemStack>", value = "additional" },
]

[[injection]]
id = "grindstone-accepts"
kind = "HEAD"
cancellable = true
target = "horizon_client::stations::grindstone_accepts"
helper = "grindstone_accepts.rs"
bindings = [
  { name = "stack", ty = "&ItemStack", value = "stack" },
]

# A Sigil of Withdrawal's gems: queued as the anvil's result is taken, given once it is.
[[injection]]
id = "anvil-take"
kind = "HEAD"
target = "horizon_client::menu::Menu::anvil_take"
helper = "anvil_take.rs"
bindings = [
  { name = "menu", ty = "&Menu", value = "&*self" },
]

[[injection]]
id = "anvil-used"
kind = "HEAD"
target = "horizon_client::game::stations::Game<'_>::anvil_used"
helper = "anvil_used.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

# ---- 0.6: effects beyond attributes ----

[[injection]]
id = "incoming"
hook = "living_incoming_damage"
hook_version = 1
kind = "HEAD"
helper = "incoming.rs"
bindings = [
  { name = "entity", ty = "i32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "damage_type", ty = "&str", value = "damage_type" },
  { name = "causing", ty = "i32", value = "causing" },
  { name = "amount", ty = "&mut f32", value = "&mut *amount" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "hears-projectiles"
hook = "hears_projectile_impacts"
hook_version = 1
kind = "HEAD"
helper = "hears_projectiles.rs"
bindings = [
  { name = "hears", ty = "&mut bool", value = "&mut *hears" },
]

[[injection]]
id = "projectile"
hook = "projectile_impact"
hook_version = 1
kind = "HEAD"
helper = "projectile.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "owner", ty = "u32", value = "owner" },
  { name = "entity", ty = "Option<u32>", value = "entity" },
]

[[injection]]
id = "destroy-block"
hook = "destroy_block"
hook_version = 1
kind = "HEAD"
helper = "destroy_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "loot-drops"
hook = "loot_drops"
hook_version = 1
kind = "HEAD"
helper = "loot_drops.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&horizon_client::mod_api::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<ItemStack>", value = "&mut *drops" },
]

[[injection]]
id = "enchantment-level"
kind = "HEAD"
cancellable = true
target = "horizon_items::item_data::ItemStack::enchantment_level"
helper = "enchantment_level.rs"
bindings = [
  { name = "stack", ty = "&ItemStack", value = "self" },
  { name = "id", ty = "&str", value = "id" },
]

# The player's melee hit (asked only while a trait mod is loaded: `api` is one).
[[injection]]
id = "melee"
hook = "living_incoming_damage_v2"
hook_version = 1
kind = "HEAD"
helper = "melee.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "i32", value = "entity" },
  { name = "weapon", ty = "Option<&ItemStack>", value = "weapon" },
  { name = "amount", ty = "&mut f32", value = "&mut *amount" },
]

# Apothic attributes (0.7): the swing's strength, life steal and overheal, healing received, experience gained
# and draw speed.
[[injection]]
id = "critical-hit"
hook = "critical_hit"
hook_version = 1
kind = "HEAD"
helper = "critical_hit.rs"
bindings = [{ name = "game", ty = "&crate::game::Game<'_>", value = "&*self" }]

[[injection]]
id = "damage-post"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_damage_post"
kind = "HEAD"
helper = "damage_post.rs"
bindings = [
  { name = "kind", ty = "&str", value = "kind" },
  { name = "damage_type", ty = "&str", value = "damage_type" },
  { name = "amount", ty = "f32", value = "amount" },
]

[[injection]]
id = "living-heal"
hook = "living_heal"
hook_version = 1
kind = "HEAD"
helper = "living_heal.rs"
bindings = [
  { name = "entity", ty = "u32", value = "entity" },
  { name = "amount", ty = "&mut f32", value = "&mut *amount" },
]

[[injection]]
id = "block-exp"
hook = "block_exp"
hook_version = 1
kind = "HEAD"
helper = "block_exp.rs"
bindings = [{ name = "experience", ty = "&mut u32", value = "&mut *experience" }]

[[injection]]
id = "arrow-loose"
hook = "arrow_loose"
hook_version = 1
kind = "HEAD"
helper = "arrow_loose.rs"
bindings = [
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "charge", ty = "&mut i32", value = "&mut *charge" },
]
